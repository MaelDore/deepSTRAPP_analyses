      "ByteCompile": "true",
      "RemoteType": "github",
      "RemoteHost": "api.github.com",
      "RemoteRepo": "BioGeoBEARS",
      "RemoteUsername": "nmatzke",
      "RemoteRef": "HEAD",
      "RemoteSha": "ba6f260f2da7e75e14cc6bf650ac0a43ea2197ae",
      "NeedsCompilation": "no"
    },
